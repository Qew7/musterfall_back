# Rails definitions leftovers cannot see as calls. Test classes are
# instantiated by Minitest, not by name. Solid Queue jobs are named in
# config/recurring.yml, not Ruby call sites.
keep:
  - ApplicationMailer
  - Backend
  - BalanceMorningSimulationJob
  - BalanceDuelMatrixBatchJob
  - PurgeOldBattlesJob
  - obstacle_kernels
  - wheel_fits?
exclude_paths:
  - test
