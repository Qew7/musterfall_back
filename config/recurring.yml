# Solid Queue recurring tasks (scheduler in bin/jobs).
# Schedule timezone: Europe/Moscow (UTC+3).

morning_balance_simulation: &morning_balance_simulation
  class: BalanceMorningSimulationJob
  queue: balance
  schedule: "0 6,7,8,9 * * * Europe/Moscow"

development:
  balance_morning_simulation:
    <<: *morning_balance_simulation

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  balance_morning_simulation:
    <<: *morning_balance_simulation
